[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agreement-metadata-extraction"
version = "0.1.0"
description = "Evidence-grounded agreement metadata extraction using Gemini Flash"
requires-python = ">=3.12"
dependencies = [
  "google-genai>=1.0,<3", "pydantic>=2.10,<3", "python-docx>=1.1,<2",
  "Pillow>=11,<13", "python-dotenv>=1,<2", "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1",
  "streamlit>=1.65,<2", "rapidfuzz>=3.12,<4", "openpyxl>=3.1,<4",
  "PyMuPDF>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
ocr = ["paddleocr>=3,<4", "paddlepaddle>=3,<4"]
ocr-fast = ["rapidocr>=3,<4", "onnxruntime>=1.20,<2", "opencv-python-headless==4.10.0.84"]

[project.scripts]
agreement-extract = "metadata_extraction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

